<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Snapshot Tracker</title>
</head>
<body>
    <h1>File Snapshot Tracker</h1>
    <p>Register a directory to track its future file changes.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <h2>Add a directory</h2>
</body>
</html>
